name: PR Title

# release-please derives the version bump and the changelog entirely from
# Conventional Commit messages, and with squash-merge the PR becomes that one
# commit: its title the subject, its description the body. So a title that is
# not a Conventional Commit does not error anywhere — it silently produces no
# bump and no changelog line, and the change ships in a release that never
# mentions it. A description release-please cannot parse does the same, and
# drops the commit from the release altogether (#24). conventional-title fails
# either up front.
#
# The version is decided by those types (plugin plan D25), so commit-types
# below also holds every commit the PR adds, and its title, to what it changes:
# a docs: or test: commit that edits a skill or the server would ship in no
# release. Both jobs are required checks.
#
# `edited` is in the trigger on purpose: a title or description fixed after
# opening must re-run these, and the bare `pull_request` event does not fire on
# an edit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Conventional Commit types release-please recognises — the same
          # set release-please-config.json sorts into changelog sections, plus
          # `revert`, which release-please handles natively. A title outside this
          # set is rejected, so the two never drift into "valid title, no bump".
          # release-please's own "chore(main): release x.y.z" PR passes: `chore`
          # is here and an optional scope is allowed.
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            test
            ci
            build
            style
            revert
      # The title is not all release-please reads. It reads the squash commit
      # whole, and the description can drop the commit, add one, or make it
      # breaking, with nothing failing: #21's description, rewrapped by
      # GitHub, began a line with a call holding a call, which the parser
      # rejects, and its fix missed the release PR with every check green. So
      # the commit is read by release-please's own code, the version the
      # release workflow's pinned action bundles, as written and as GitHub
      # wraps it, and must read as the one commit the title says
      # (scripts/squash-message.mjs).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # From the lockfile, so the release-please read is the pinned one; no
      # build, and no git hooks on a runner.
      - run: npm ci --ignore-scripts
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/squash-message.mjs

  commit-types:
    runs-on: ubuntu-latest
    steps:
      # Every branch and tag: the range needs the base's history, and a commit
      # already inside a published build (reachable from a v* tag) is skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-types.mjs "$BASE" "$HEAD"
