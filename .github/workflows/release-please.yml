name: Release

# The whole release, in one run per push to main (plugin plan D25).
# release-please reads the Conventional Commits landed there and keeps one
# release pull request whose version it computes from them, with the new
# CHANGELOG.md section. Then, in this same run:
#
# - when it opened or updated that PR, the PR's branch is built and published
#   as the next pre-release of the computed version, v<x.y.z>-pre.<n>;
# - when a draft GitHub release's tag exists — the state merging the PR leaves
#   (release-please-config.json: draft, force-tag-creation) — the tag is built
#   and the draft published. That is read from GitHub, not from the action's
#   outputs (scripts/pending-release.mjs): for 0.1.2 the action made the tag
#   and the draft, then failed relabelling the PR, so it reported no release
#   and the build never ran. The next run, or a dispatch from the Actions tab,
#   finishes whatever a run left undone.
#
# One run, because everything here acts with GITHUB_TOKEN, and by GitHub's
# rule against recursive runs nothing that token does — opening the PR,
# pushing its branch, making the tag — starts another workflow. So nothing
# waits to be started: the build is a job of this run, and no personal token
# has to be made, stored and rotated (a deliberate choice). The one setting it
# needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests", or release-please cannot open its PR.
#
# One integration branch only: every release writes into the one
# v<x.y.z>-pre.<n> tag namespace, so two would race for numbers and interleave
# two code lines' builds.
on:
  push:
    branches: [main]
  # To retry a failed run without waiting for another merge.
  workflow_dispatch:

# One release run at a time, never cancelled once running. GitHub keeps only
# the newest pending run, so pushes that land meanwhile collapse into one,
# which sees all of them.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    # A dispatch on any other branch would have release-please open a release
    # PR against that branch.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The branch that was pushed is the one being released.
          target-branch: ${{ github.ref_name }}

  # Only when release-please changed its PR: a merge that brought nothing
  # releasable — docs alone — leaves the PR as it was and builds nothing.
  prerelease:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_branch }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.release-please.outputs.pr_branch }}
      ref_type: branch

  # Whatever release-please did, failed included: what is left to finish is
  # read from GitHub.
  pending:
    needs: release-please
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # GitHub lists a draft only to a token that can push.
      contents: write
      pull-requests: read
    outputs:
      finish: ${{ steps.p.outputs.finish }}
      relabel: ${{ steps.p.outputs.relabel }}
    steps:
      # Repository code runs here with a token that can push: it is handed to
      # the one step that reads GitHub, never left in the checkout's config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pending-release.mjs

  # A PR left pending makes release-please's next run create its release again
  # and refuse to open the next release PR. Beside the build, not before it:
  # a label that will not change must not hold back a release, and only the
  # next run, which waits for this one, reads the labels.
  relabel:
    needs: pending
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.pending.outputs.relabel != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label released PRs as release-please would
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELABEL: ${{ needs.pending.outputs.relabel }}
        run: |
          for pr in $(jq -r '.[]' <<<"$RELABEL"); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=autorelease: tagged" >/dev/null
            # A label already gone is the state this sets, so only a 404 is
            # success; anything else fails the run.
            if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$pr/labels/autorelease:%20pending" \
              >/dev/null 2>unlabel.err; then
              grep -q "HTTP 404" unlabel.err || { cat unlabel.err; exit 1; }
            fi
            echo "#$pr: autorelease: pending -> autorelease: tagged"
          done

  # The tag is built and the draft published, with Latest off: advance, below,
  # owns Latest. Each tag on its own, so one that fails does not stop another,
  # and one at a time, oldest first.
  release:
    needs: pending
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.pending.outputs.finish != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.finish) }}
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ matrix.tag }}
      ref_type: tag

  # The release branch and GitHub's Latest follow the newest published
  # release (scripts/release-branch.mjs, #7, #43): read from GitHub after
  # every build in this run, whatever each did. One job writes both, release
  # runs never overlap, and the next run repeats whatever this one left
  # undone. Builds publish with Latest off, so a release finished late or
  # built by hand moves neither until a release run does.
  advance:
    needs: [pending, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No credentials in the checkout while repository code runs: the token
      # is handed to the pushes below and nowhere else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-branch.mjs plan
      # The publication order (plugin plan §5 M1): what the branch holds is
      # the release's own archive, downloaded and checked against its
      # SHA256SUMS.txt. The zip's line is checked alone, matched exactly, so an
      # archive missing from the sums fails rather than passing with nothing
      # checked.
      - name: Build the branch from the newest release's verified archive
        if: steps.plan.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST: ${{ steps.plan.outputs.newest }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release download "$NEWEST" --dir "$assets" \
            --pattern "wolfram-plugin-$VERSION.zip" --pattern SHA256SUMS.txt
          (cd "$assets" && awk -v f="wolfram-plugin-$VERSION.zip" '$2 == f' SHA256SUMS.txt | sha256sum --check --strict)
          node scripts/release-branch.mjs tree "$assets/wolfram-plugin-$VERSION.zip" "$RUNNER_TEMP/tree" "$VERSION"
      - name: Move the branch forward, and tag its version
        if: steps.plan.outputs.move == 'true' || steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST: ${{ steps.plan.outputs.newest }}
          VERSION: ${{ steps.plan.outputs.version }}
          MOVE: ${{ steps.plan.outputs.move }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          # The token is masked in logs, but this encoding of it isn't.
          echo "::add-mask::$auth"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$@"; }
          base=
          # The full ref: a bare `release` matches any branch ending in /release.
          if git ls-remote --exit-code --heads origin refs/heads/release >/dev/null; then
            git fetch -q --depth=1 origin +refs/heads/release:refs/remotes/origin/release
            base=origin/release
          fi
          target=$base
          if [ "$MOVE" = true ]; then
            if [ -n "$base" ]; then git switch -q -c advance "$base"; else git switch -q --orphan advance; fi
            git rm -rq --ignore-unmatch . && git clean -fdxq
            cp -R "$RUNNER_TEMP/tree/." .
            git add -A
            git commit -q -m "wolfram $VERSION, from $NEWEST"
            # A plain push, refused unless it fast-forwards: the branch only
            # ever moves forward, and never past a push made meanwhile.
            push HEAD:refs/heads/release
            target=HEAD
          fi
          # Straight to the remote: no local tag to collide with, and a push
          # that never replaces a tag already there.
          if [ -n "$TAG" ]; then
            push "$(git rev-parse "$target"):refs/tags/$TAG"
          fi
      # After the branch, so Latest never names a release the branch doesn't
      # carry yet.
      - name: Mark the newest release Latest
        if: steps.plan.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST: ${{ steps.plan.outputs.newest }}
        run: gh release edit "$NEWEST" --latest
