# Throwaway (#96, #90): cache-mode none at workflow level, calling a workflow
# that saves to the cache; and an artifact whose name a re-run repeats.
# Removed before merge.
name: Probe none
on: pull_request
permissions:
  contents: read
cache-mode: none
jobs:
  called:
    uses: ./.github/workflows/probe-called.yml # zizmor: ignore[self-repository]
    with:
      key: probe96-none
  artifact:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe90-artifact
          path: probe.txt
          if-no-files-found: error
