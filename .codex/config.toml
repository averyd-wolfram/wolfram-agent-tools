# Codex's project layer for this repository. Codex loads it only when the user has marked the
# repository trusted (`[projects."<path>"] trust_level = "trusted"` in ~/.codex/config.toml);
# untrusted, it silently ignores this file and .codex/agents/ alike.
#
# No `model`: Codex then uses the newest default model, which is what reviews here should run
# on. A pin here would go stale the day a newer model ships, as 6.1 did on 2026-11-17.

# Reviews and red teams are most of what Codex does here, and the default (medium) misses
# what a second round then finds.
model_reasoning_effort = "high"

# The same server as .mcp.json, which Codex does not read; the suite fails when the two differ.
# It gives Codex the Wolfram tools a Claude Code session gets from the plugin, so a review can
# lint a .wl file or look a symbol up rather than guess. A tool call starts a kernel, which
# costs a licence seat, and so does a session's first tool listing while no list is cached:
# Codex lists tools as it starts, as Claude Code does, and the list is cached on disk for both.
#
# Not .mcp.json's name: Codex merges a table of the same name from the user's own config into
# this one, so a user with a `WolframLanguage` server of their own, an HTTP one say, would have
# Codex refuse the whole configuration and not start in this repository at all.
[mcp_servers.wolfram-agent-tools-dev]
command = "npm"
args = ["run", "--silent", "mcp"]
env = { MCP_SERVER_NAME = "WolframLanguage", WOLFRAM_MCP_IDLE_MINUTES = "15" }
# Codex passes a server only a short allow-list of its environment, so without this every
# setting a user exported, and the directories the broker and cache live in, would vanish:
# a different kernel, a different flavour, a different broker. Every variable src/ reads, less
# the Windows ones and those `env` sets; the suite fails when one is missing. A variable that
# WOLFRAM_MCP_KERNEL_ENV names must be added here by hand.
env_vars = [
  "LLMKIT_ENABLED", "MCP_APPS_ENABLED", "MCP_APPS_NOTEBOOK_METHOD", "MCP_TOOL_OPTIONS",
  "WOLFRAMINIT", "WOLFRAMSCRIPT_CONFIGURATIONPATH", "WOLFRAMSCRIPT_KERNELPATH", "WOLFRAM_BASE",
  "WOLFRAM_CALL_TIMEOUT_SECONDS", "WOLFRAM_CLOUDBASE", "WOLFRAM_HOME", "WOLFRAM_IDLE_MINUTES",
  "WOLFRAM_INSTALLATION_DIRECTORY", "WOLFRAM_KERNEL_PATH", "WOLFRAM_LOCALBASE",
  "WOLFRAM_MCP_CACHE", "WOLFRAM_MCP_CALL_TIMEOUT_SECONDS", "WOLFRAM_MCP_DEFAULT_SERVER",
  "WOLFRAM_MCP_INSPECT", "WOLFRAM_MCP_KERNEL", "WOLFRAM_MCP_KERNEL_ENV",
  "WOLFRAM_MCP_LICENSE_LIMIT", "WOLFRAM_MCP_LOG", "WOLFRAM_MCP_LSP", "WOLFRAM_MCP_MAX_KERNELS",
  "WOLFRAM_MCP_MIN_VERSION", "WOLFRAM_MCP_RESERVE_SEATS", "WOLFRAM_MCP_RUNTIME_DIR",
  "WOLFRAM_MCP_SERVER_NAME", "WOLFRAM_MCP_SHARE", "WOLFRAM_MCP_START_TIMEOUT_SECONDS",
  "WOLFRAM_MCP_VERSION", "WOLFRAM_MIN_VERSION", "WOLFRAM_START_TIMEOUT_SECONDS",
  "WOLFRAM_USERBASE", "XDG_CACHE_HOME", "XDG_CONFIG_HOME", "XDG_RUNTIME_DIR",
]
# The server answers every call by its own ceiling (`evaluationCeilingMs`), which a requested
# timeConstraint raises as far as MAX_TIME_MS, 24 days, so Codex's timeout must never be the one
# that fires: at its default of 60 s, a cold kernel start alone would outlast it. A minute past
# that; it is the only bound left on a call when the user configured no ceiling at all.
tool_timeout_sec = 2073660
